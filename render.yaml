services:
  # All-in-One Full-Stack Web Service (Serves React UI + Express API + OSM proxy)
  - type: web
    name: local-business-finder
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: USE_IN_MEMORY_DB_FALLBACK
        value: "true"
      - key: CLIENT_URL
        value: "http://localhost:3000,https://*.vercel.app,https://*.onrender.com"
      - key: MONGODB_URI
        sync: false
